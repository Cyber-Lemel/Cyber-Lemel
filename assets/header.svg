<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Galaxy with planets" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0920"/>
      <stop offset="1" stop-color="#1a1642"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6a4fd8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6a4fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f7bd8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2f7bd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#d6c9ff"/>
      <stop offset="0.5" stop-color="#7a66e0"/>
      <stop offset="1" stop-color="#2a2370"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffe2bd"/>
      <stop offset="0.55" stop-color="#e58f5f"/>
      <stop offset="1" stop-color="#7a3a2e"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#c5e4ff"/>
      <stop offset="0.55" stop-color="#4f93d9"/>
      <stop offset="1" stop-color="#1c3a73"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f1f1f7"/>
      <stop offset="1" stop-color="#8a8aa8"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>
  <ellipse cx="300" cy="130" rx="320" ry="110" fill="url(#nebula)"/>
  <ellipse cx="760" cy="150" rx="300" ry="120" fill="url(#nebula2)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.2" opacity="0.8"/>
    <circle cx="95" cy="150" r="1" opacity="0.6"/>
    <circle cx="130" cy="40" r="1.4" opacity="0.9"/>
    <circle cx="250" cy="215" r="1.1" opacity="0.7"/>
    <circle cx="285" cy="60" r="1" opacity="0.6"/>
    <circle cx="330" cy="130" r="1.5" opacity="0.9"/>
    <circle cx="380" cy="30" r="1" opacity="0.7"/>
    <circle cx="420" cy="190" r="1.2" opacity="0.8"/>
    <circle cx="470" cy="95" r="1" opacity="0.6"/>
    <circle cx="560" cy="45" r="1.4" opacity="0.9"/>
    <circle cx="600" cy="140" r="1" opacity="0.6"/>
    <circle cx="640" cy="225" r="1.2" opacity="0.8"/>
    <circle cx="690" cy="70" r="1" opacity="0.7"/>
    <circle cx="930" cy="40" r="1.3" opacity="0.9"/>
    <circle cx="960" cy="200" r="1" opacity="0.6"/>
    <circle cx="905" cy="235" r="1.2" opacity="0.8"/>
    <circle cx="20" cy="110" r="1" opacity="0.6"/>
    <circle cx="205" cy="165" r="1" opacity="0.5"/>
    <circle cx="515" cy="240" r="1" opacity="0.6"/>
    <circle cx="990" cy="120" r="1" opacity="0.6"/>
  </g>
  <!-- a few brighter stars -->
  <g fill="#cfc4ff">
    <circle cx="170" cy="215" r="1.8" opacity="0.9"/>
    <circle cx="445" cy="35" r="1.8" opacity="0.9"/>
    <circle cx="615" cy="95" r="1.6" opacity="0.8"/>
  </g>

  <!-- faint orbit line -->
  <ellipse cx="500" cy="130" rx="460" ry="70" fill="none" stroke="#8b7cf6" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="2 6" transform="rotate(-6 500 130)"/>

  <!-- small warm planet -->
  <circle cx="185" cy="75" r="24" fill="url(#warm)"/>

  <!-- tiny blue planet -->
  <circle cx="75" cy="205" r="13" fill="url(#blue)"/>

  <!-- moon -->
  <circle cx="530" cy="190" r="8" fill="url(#moon)"/>

  <!-- ringed planet -->
  <g transform="translate(810 130) rotate(-18)">
    <path d="M -128 0 A 128 26 0 0 1 128 0" fill="none" stroke="#b8a9ff" stroke-opacity="0.55" stroke-width="3"/>
    <circle r="62" fill="url(#violet)"/>
    <path d="M -128 0 A 128 26 0 0 0 128 0" fill="none" stroke="#d6c9ff" stroke-opacity="0.85" stroke-width="3"/>
    <path d="M -108 0 A 108 21 0 0 0 108 0" fill="none" stroke="#b8a9ff" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
